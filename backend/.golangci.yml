# golangci-lint v2 configuration. Run: make lint
version: "2"

run:
  timeout: 5m
  tests: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - sezzle.com/calculator

linters:
  # Defaults: errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - depguard
    - errorlint
    - gosec
    - misspell
    - nilerr
    - revive
    - testifylint
    - unconvert
  settings:
    depguard:
      # Hexagonal dependency rule: the domain is pure and never reaches into adapters or transport.
      rules:
        domain:
          files:
            - "**/internal/domain/**"
          deny:
            - pkg: sezzle.com/calculator/internal/platform
              desc: domain must not import platform adapters (dependencies point inward)
            - pkg: github.com/gin-gonic/gin
              desc: Gin is the HTTP adapter; keep it in internal/platform
            - pkg: net/http
              desc: HTTP is an adapter concern; keep it in internal/platform
            - pkg: encoding/json
              desc: wire formats are an adapter concern; keep them in internal/platform
    errcheck:
      check-type-assertions: true
    govet:
      enable-all: true
      disable:
        - fieldalignment
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    rules:
      # The domain/error package intentionally shadows the builtin name.
      - path: internal/domain/error/
        linters: [revive]
        text: "redefines-builtin-id"

issues:
  max-issues-per-linter: 50
  max-same-issues: 3
