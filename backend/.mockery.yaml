# Mocks for domain ports. Run: make generate-mocks (never hand-edit generated mocks).
all: false
with-expecter: true
mockname: "Mock{{.InterfaceName}}"
outpkg: "mocks"
dir: "internal/domain/ports/mocks"
filename: "{{.InterfaceName | snakecase}}.go"
disable-version-string: true
issue-845-fix: true
resolve-type-alias: false
packages:
  sezzle.com/calculator/internal/domain/ports:
    config:
      all: true
